plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android'; id 'org.jetbrains.kotlin.plugin.compose'; id 'androidx.baselineprofile' }

android {
    namespace 'com.rallydot.app'
    compileSdk 36
    defaultConfig {
        applicationId 'com.rallydot.app'
        minSdk 24
        targetSdk 36
        versionCode 7
        versionName '0.2.3'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        release {
            if (System.getenv('RALLY_ANDROID_KEYSTORE')) {
                storeFile file(System.getenv('RALLY_ANDROID_KEYSTORE'))
                storePassword System.getenv('RALLY_ANDROID_STORE_PASSWORD')
                keyAlias 'rally'
                keyPassword System.getenv('RALLY_ANDROID_STORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { compose true; buildConfig true }
    testOptions { unitTests.returnDefaultValues = true }
}

dependencies {
 implementation platform('androidx.compose:compose-bom:2025.08.01')
 implementation 'androidx.activity:activity-compose:1.12.1'
 implementation 'androidx.core:core-splashscreen:1.2.0'
 implementation 'androidx.profileinstaller:profileinstaller:1.4.1'
 baselineProfile project(':baselineprofile')
 implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0'
 implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.10.0'
 implementation 'androidx.compose.material3:material3'
 implementation 'androidx.compose.foundation:foundation'
 implementation 'androidx.compose.ui:ui'
 implementation 'androidx.compose.material:material-icons-extended'
 implementation 'com.squareup.okhttp3:okhttp:4.12.0'
 implementation 'io.coil-kt:coil-compose:2.7.0'
 implementation 'io.coil-kt:coil-svg:2.7.0'
 implementation 'androidx.media3:media3-exoplayer:1.9.2'
 implementation 'androidx.media3:media3-ui:1.9.2'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.json:json:20250517'
 androidTestImplementation 'androidx.test.ext:junit:1.3.0'
 androidTestImplementation 'androidx.test:runner:1.7.0'
 androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}

baselineProfile {
    automaticGenerationDuringBuild = false
    saveInSrc = true
}

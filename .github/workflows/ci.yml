name: Source verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    # Register a dedicated disposable runner; never attach production state.
    # Public pull requests do not automatically execute on a self-hosted host.
    runs-on: [self-hosted, linux, x64, rally-isolated]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install -r requirements.txt
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:contracts
      - run: npm run build:auth
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
